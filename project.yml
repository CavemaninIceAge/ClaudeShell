name: ClaudexShell
options:
  bundleIdPrefix: com.skywalker
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # 本机自用：Sign to Run Locally，不进沙盒（要起 claude 子进程、读 ~/.claude）。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  ClaudexShell:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      # 网页渲染层整目录拷进 Resources/web，运行时按子目录取。
      - path: App/Resources/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "Claudex Shell"
        PRODUCT_BUNDLE_IDENTIFIER: com.skywalker.claudeshell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: Claudex Shell
        CFBundleName: Claudex Shell
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "5"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026"
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: "仅在你点击听写时使用麦克风，将语音填入输入框；不会自动发送。"
        NSSpeechRecognitionUsageDescription: "将你主动录入的语音转为输入框文字，识别可能使用 Apple 语音服务；不会自动发送。"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
