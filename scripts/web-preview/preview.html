<body>
<main id="root">
  <div id="list"></div>
  <div id="working" hidden><span class="pulse"></span><span id="working-text"></span></div>
</main>
<script src="../../App/Resources/web/transcript.js"></script>
<script>
  // 网页层的固定样张：不用真跑 claude 也能看各种块长什么样。
  const now = new Date().toISOString();
  CS.upsert({ id: 'u1', kind: 'user', text: '把 ~/Developer 里的目录列出来，做成表格', done: true }, 0);
  CS.upsert({ id: 'a1', kind: 'assistant', done: true, blocks: [
    { id: 't1', kind: 'thinking', text: '先看一眼目录，再决定表格列。', done: true },
    { id: 'tool1', kind: 'tool', done: true, tool: { id: 'tool1', name: 'Bash', input: { command: 'ls ~/Developer', description: '列出开发目录' }, result: 'ClaudeShell\nOPCDesk\nhoronis', done: true, isError: false, startedAt: '2026-09-13T01:00:00Z', endedAt: '2026-09-13T01:00:12Z' } },
    { id: 'tool2', kind: 'tool', done: true, tool: { id: 'tool2', name: 'Edit', input: { file_path: '/Users/x/a.swift', old_string: 'let a = 1', new_string: 'let a = 2' }, result: 'ok', done: true, isError: false } },
    { id: 'x1', kind: 'text', done: true, text: '| 目录 | 用途 |\n|---|---|\n| ClaudeShell | 这个壳 |\n\n```swift\nlet x = 1\n```\n\n完成。' },
  ]}, 1);
  CS.upsert({ id: 'a2', kind: 'assistant', done: false, blocks: [
    { id: 't2', kind: 'thinking', text: '', done: false },
  ]}, 2);
  CS.upsert({ id: 'n1', kind: 'note', text: '已停止', level: 'info', done: true }, 3);
  // 带附件的用户消息：图片缩略图 + 文件片 + 目录片；只有附件、没打字的也要能看。
  const dot = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
  CS.upsert({ id: 'u2', kind: 'user', text: '这张图和这份文档说明了什么？', done: true, attachments: [
    { kind: 'image', name: 'photo.jpg', path: '/Users/x/Desktop/photo.jpg', preview: dot },
    { kind: 'file', name: '说明 文档.txt', path: '/Users/x/Desktop/说明 文档.txt' },
    { kind: 'directory', name: '一个目录', path: '/Users/x/Desktop/一个目录' },
  ]}, 4);
  CS.upsert({ id: 'u3', kind: 'user', text: '', done: true, attachments: [
    { kind: 'image', name: '剪贴板图片.png', preview: dot },
  ]}, 5);
  document.querySelectorAll('details').forEach((d) => { d.open = true; });
</script>
